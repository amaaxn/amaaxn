name: Build animated bunny

on:
  schedule:
    - cron: "0 0 * * 1"          # Mondays 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate animated-bunny.svg
        run: |
          python3 - << 'PY'
          from pathlib import Path

          w, h = 1200, 260
          h80 = h - 80
          h120 = h - 120
          h52 = h - 52

          svg = f'''<?xml version="1.0" encoding="UTF-8"?>
          <svg xmlns="http://www.w3.org/2000/svg" width="{w}" height="{h}" viewBox="0 0 {w} {h}">
            <defs>
              <!-- Gradient accents (purple -> burgundy) -->
              <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%"  stop-color="#6D28D9"/>
                <stop offset="50%" stop-color="#7C3AED"/>
                <stop offset="100%" stop-color="#7F1D1D"/>
              </linearGradient>
              <!-- Soft glow for stars -->
              <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="1.2" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>

            <!-- Dark background -->
            <rect width="100%" height="100%" fill="#0b0b12"/>

            <!-- Subtle starfield -->
            <g fill="#C4B5FD" opacity="0.9" filter="url(#glow)">
              <circle cx="80"  cy="40"  r="1.2"/>
              <circle cx="210" cy="70"  r="1"/>
              <circle cx="360" cy="35"  r="1.4"/>
              <circle cx="520" cy="60"  r="1.1"/>
              <circle cx="710" cy="45"  r="1.3"/>
              <circle cx="880" cy="70"  r="1.2"/>
              <circle cx="1030" cy="30" r="1.1"/>
            </g>

            <!-- Ground line -->
            <rect x="0" y="{h-48}" width="{w}" height="2" fill="url(#grad)" opacity="0.65"/>

            <!-- Travel path (for reference / spacing) -->
            <path id="track" d="M 100 {h80}
                                 C 180 {h120}, 220 {h120}, 250 {h80}
                                 S 330 {h120}, 410 {h80}
                                 S 490 {h120}, 560 {h80}
                                 S 650 {h120}, 720 {h80}
                                 S 810 {h120}, 880 {h80}
                                 S 970 {h120}, 1040 {h80}
                                 S 1130 {h120}, 1180 {h80}"
                  fill="none" stroke="none" />

            <!-- Shadow -->
            <ellipse id="shadow" cx="100" cy="{h52}" rx="28" ry="8" fill="#000000" opacity="0.35">
              <animate attributeName="rx" values="28;20;28" dur="1.2s" repeatCount="indefinite"
                       keyTimes="0;0.5;1" keySplines=".25 .1 .25 1;.25 .1 .25 1" calcMode="spline"/>
              <animate attributeName="opacity" values="0.35;0.2;0.35" dur="1.2s" repeatCount="indefinite"
                       keyTimes="0;0.5;1" keySplines=".25 .1 .25 1;.25 .1 .25 1" calcMode="spline"/>
              <!-- Move along with the bunny -->
              <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
                <mpath href="#track"/>
              </animateMotion>
            </ellipse>

            <!-- Bunny group (all animations inside; no xlink needed) -->
            <g id="bunny" transform="translate(100 {h80})">
              <!-- Tail -->
              <circle cx="-24" cy="-16" r="6" fill="#EDE9FE"/>
              <!-- Body -->
              <ellipse cx="0" cy="-18" rx="26" ry="18" fill="#EDE9FE"/>
              <!-- Head -->
              <ellipse cx="20" cy="-28" rx="14" ry="12" fill="#EDE9FE"/>
              <!-- Ears -->
              <g id="ears" transform="translate(20 -42)">
                <ellipse cx="-4" cy="-6" rx="4" ry="12" fill="#EDE9FE"/>
                <ellipse cx=" 4" cy="-6" rx="4" ry="12" fill="#EDE9FE"/>
                <!-- Ear wiggle -->
                <animateTransform attributeName="transform" attributeType="XML"
                  type="rotate" dur="1.2s"
                  values="-6 0 0; 3 0 0; -6 0 0"
                  repeatCount="indefinite" keyTimes="0;0.5;1"
                  keySplines=".25 .1 .25 1;.25 .1 .25 1" calcMode="spline"/>
              </g>
              <!-- Eye -->
              <circle cx="26" cy="-28" r="1.8" fill="#0b0b12"/>
              <!-- Blink -->
              <rect x="24" y="-30" width="4" height="4" fill="#0b0b12">
                <animate attributeName="height" values="4;0;4" dur="3.6s" repeatCount="indefinite"
                  keyTimes="0;0.04;0.08" begin="1.4s" />
              </rect>

              <!-- Hop: vertical motion + squash/stretch -->
              <animateTransform attributeName="transform" additive="sum" type="translate"
                dur="1.2s" repeatCount="indefinite"
                values="0 0; 0 -22; 0 0" keyTimes="0;0.5;1"
                keySplines=".25 .1 .25 1; .25 .1 .25 1" calcMode="spline"/>
              <animateTransform attributeName="transform" additive="sum" type="scale"
                dur="1.2s" repeatCount="indefinite"
                values="1 1; 1 1; 1.08 0.92; 1 1" keyTimes="0;0.45;0.55;1"
                keySplines=".25 .1 .25 1; .25 .1 .25 1; .25 .1 .25 1" calcMode="spline"/>

              <!-- Horizontal travel across the screen along the track -->
              <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
                <mpath href="#track"/>
              </animateMotion>
            </g>

            <!-- Title -->
            <text x="50%" y="36" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui"
              font-size="20" fill="#C4B5FD" opacity="0.9">Amaan Abubakar</text>
            <text x="50%" y="58" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui"
              font-size="13" fill="#A78BFA" opacity="0.9">CS & Applied Math · React · Flask · TypeScript</text>
          </svg>'''

          out = Path("output")
          out.mkdir(parents=True, exist_ok=True)
          Path("output/animated-bunny.svg").write_text(svg, encoding="utf-8")
          print("Wrote output/animated-bunny.svg")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/animated-bunny.svg
          git commit -m "fix: bunny animation without xlink namespace" || echo "No changes"
          git push
