name: Generate snake (dark + smooth, same filename)

on:
  schedule:
    - cron: "0 0 * * 1"       # Mondays 00:00 UTC
  workflow_dispatch:           # allow manual run
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Generate the base snake
      - name: Generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: amaaxn
          outputs: |
            ./dist/snake.svg

      # 2) Post-process: add dark bg + smoother timing, then save back to output/snake.svg
      - name: Convert to dark background + smooth animation
        run: |
          python3 - << 'PY'
          import re, pathlib
          src_path = pathlib.Path("dist/snake.svg")
          out_dir = pathlib.Path("output")
          out_dir.mkdir(parents=True, exist_ok=True)
          svg = src_path.read_text(encoding="utf-8")

          # IMPORTANT: use \1 (single backslash) to keep the captured <svg ...> tag
          svg = re.sub(
              r"(<svg[^>]*>)",
              r'\1\n<rect width="100%" height="100%" fill="#0b0b12"/>',
              svg,
              count=1,
              flags=re.IGNORECASE
          )

          # Soften grid lines a touch (best-effort)
          svg = re.sub(r'stroke-opacity="0\.2"', 'stroke-opacity="0.12"', svg)

          # Trim animation durations slightly for a smoother feel
          def scale_dur(m):
              try:
                  n = int(m.group(1))
              except ValueError:
                  return m.group(0)
              new = max(5, int(round(n * 0.85)))
              return f'dur="{new}s"'
          svg = re.sub(r'dur="(\d+)s"', scale_dur, svg)

          # Optional: tint the snake path once to a purple accent
          svg = re.sub(r'stroke="#[0-9a-fA-F]{6}"', 'stroke="#8B5CF6"', svg, count=1)

          (out_dir / "snake.svg").write_text(svg, encoding="utf-8")
          print("Wrote output/snake.svg")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/snake.svg
          git commit -m "fix: valid svg (dark + smooth)" || echo "No changes"
          git push
