name: Generate snake (dark + smooth)

on:
  schedule:
    - cron: "0 0 * * 1"         # Mondays 00:00 UTC
  workflow_dispatch:             # allow manual run
  push:
    branches: [main]

permissions:
  contents: write                # REQUIRED to commit the generated file

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Generate the base snake SVG
      - name: Generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: amaaxn
          outputs: |
            ./dist/snake.svg

      # 2) Post-process with Python for dark bg + smoother animation
      - name: Post-process snake to dark + smooth
        run: |
          python3 - << 'PY'
          import re, sys, pathlib
          src = pathlib.Path("dist/snake.svg").read_text(encoding="utf-8")

          # Insert a dark background right after the opening <svg ...> tag
          # This ensures it looks correct on dark mode everywhere.
          src = re.sub(
              r"(<svg[^>]*>)",
              r'\\1\n<rect width="100%" height="100%" fill="#0b0b12"/>',
              src,
              count=1,
              flags=re.IGNORECASE
          )

          # Optional: soften any bright grid lines
          src = re.sub(r'stroke-opacity="0\.2"', 'stroke-opacity="0.12"', src)

          # Make animation a bit more fluid by trimming durations (e.g., dur="12s" -> dur="10s")
          def scale_dur(m):
              n = int(m.group(1))
              new = max(5, int(round(n * 0.85)))  # keep reasonable floor
              return f'dur="{new}s"'
          src = re.sub(r'dur="(\d+)s"', scale_dur, src)

          pathlib.Path("output").mkdir(parents=True, exist_ok=True)
          pathlib.Path("output/snake-dark.svg").write_text(src, encoding="utf-8")
          print("Wrote output/snake-dark.svg")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/snake-dark.svg
          git commit -m "chore: update dark snake" || echo "No changes"
          git push
