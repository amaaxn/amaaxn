name: Generate snake

on:
  schedule:
    - cron: "0 0 * * 1"      # Mondays 00:00 UTC
  workflow_dispatch:          # allow manual run
  push:
    branches: [main]

permissions:
  contents: write             # required to commit output

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: amaaxn
          outputs: |
            ./dist/snake.svg

      - name: Save to /output and commit
        run: |
          mkdir -p output
          cp dist/snake.svg output/snake.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/snake.svg
          git commit -m "chore: update snake" || echo "No changes"
          git push
