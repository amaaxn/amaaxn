<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#6D28D9"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#0b0b12"/>

  <g fill="#C4B5FD" opacity="0.9" filter="url(#glow)">
    <circle cx="80"  cy="40"  r="1.2"/>
    <circle cx="210" cy="70"  r="1"/>
    <circle cx="360" cy="35"  r="1.4"/>
    <circle cx="520" cy="60"  r="1.1"/>
    <circle cx="710" cy="45"  r="1.3"/>
    <circle cx="880" cy="70"  r="1.2"/>
    <circle cx="1030" cy="30" r="1.1"/>
  </g>

  <rect x="0" y="212" width="1200" height="2" fill="url(#grad)" opacity="0.65"/>

  <!-- Shadow -->
  <ellipse cx="100" cy="208" rx="28" ry="8" fill="#000" opacity="0.35">
    <animate attributeName="rx" values="28;20;28" dur="1.2s" repeatCount="indefinite"
             keyTimes="0;0.5;1" keySplines=".25 .1 .25 1;.25 .1 .25 1" calcMode="spline"/>
    <animate attributeName="opacity" values="0.35;0.2;0.35" dur="1.2s" repeatCount="indefinite"
             keyTimes="0;0.5;1" keySplines=".25 .1 .25 1;.25 .1 .25 1" calcMode="spline"/>
    <animate attributeName="cx" values="100;250;410;560;720;880;1040;1180" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Bunny at start position -->
  <g transform="translate(100 180)">
    <!-- mover group translates horizontally across the screen -->
    <g id="mover">
      <!-- Bunny shapes -->
      <!-- Tail -->
      <circle cx="-24" cy="-16" r="7" fill="#EDE9FE"/>
      <!-- Body -->
      <ellipse cx="0" cy="-18" rx="28" ry="18" fill="#EDE9FE"/>
      <!-- Head -->
      <ellipse cx="22" cy="-28" rx="16" ry="12" fill="#EDE9FE"/>
      <!-- Ears (bigger + inner color) -->
      <g id="ears" transform="translate(22 -44)">
        <ellipse cx="-6" cy="-6" rx="5.5" ry="15" fill="#EDE9FE"/>
        <ellipse cx="-6" cy="-6" rx="3.2" ry="9" fill="#D3BDFE"/>
        <ellipse cx="6" cy="-6" rx="5.5" ry="15" fill="#EDE9FE"/>
        <ellipse cx="6" cy="-6" rx="3.2" ry="9" fill="#D3BDFE"/>
        <animateTransform attributeName="transform" type="rotate" dur="1.2s"
          values="-6 0 0; 4 0 0; -6 0 0" repeatCount="indefinite"
          keyTimes="0;0.5;1" keySplines=".25 .1 .25 1;.25 .1 .25 1" calcMode="spline"/>
      </g>
      <!-- Eye + blink -->
      <circle cx="28" cy="-28" r="2.1" fill="#0b0b12"/>
      <rect x="26" y="-30.5" width="4" height="4.2" fill="#0b0b12">
        <animate attributeName="height" values="4.2;0;4.2" dur="3.6s" repeatCount="indefinite"
          keyTimes="0;0.04;0.08" begin="1.2s"/>
      </rect>

      <!-- Hop (vertical + squash/stretch) -->
      <animateTransform attributeName="transform" additive="sum" type="translate"
        dur="1.2s" repeatCount="indefinite"
        values="0 0; 0 -22; 0 0" keyTimes="0;0.5;1"
        keySplines=".25 .1 .25 1; .25 .1 .25 1" calcMode="spline"/>
      <animateTransform attributeName="transform" additive="sum" type="scale"
        dur="1.2s" repeatCount="indefinite"
        values="1 1; 1 1; 1.10 0.90; 1 1" keyTimes="0;0.45;0.55;1"
        keySplines=".25 .1 .25 1; .25 .1 .25 1; .25 .1 .25 1" calcMode="spline"/>
    </g>

    <!-- Horizontal travel across checkpoints (no namespaces) -->
    <animateTransform  attributeName="transform" type="translate"
      dur="8s" repeatCount="indefinite" values="0 0;150 0;310 0;460 0;620 0;780 0;940 0;1080 0"/>
  </g>

  <!-- Title -->
  <text x="50%" y="36" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui"
    font-size="20" fill="#C4B5FD" opacity="0.9">Amaan Abubakar</text>
  <text x="50%" y="58" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui"
    font-size="13" fill="#A78BFA" opacity="0.9">CS & Applied Math · React · Flask · TypeScript</text>
</svg>